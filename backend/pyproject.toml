[project]
name = "solarlanka-backend"
version = "0.1.0"
description = "Solar Lanka API and business services"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.8", "uv==0.12.17"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
