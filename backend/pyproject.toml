[project]
name = "solarlanka-backend"
version = "0.1.0"
description = "Solar Lanka API and business services"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "arcjet==1.2.0",
    "clerk-backend-api==7.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "inngest==0.5.19",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.54",
    "svix==2.5.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "uv==0.12.17"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = ["database: integration checks requiring the isolated PostgreSQL test database"]
